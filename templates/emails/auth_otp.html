{% extends "emails/base.html" %}

{% block body %}
<p style="margin:0 0 12px;font-size:15px;line-height:1.7;color:#374151;">
  {{ primary_note }}
</p>

<div style="margin:24px 0;padding:24px;border-radius:24px;background:#ecfdf5;border:1px solid #a7f3d0;text-align:center;">
  <div style="font-size:12px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:#0f766e;">{{ otp_label }}</div>
  <div style="margin-top:10px;font-size:38px;font-weight:800;letter-spacing:0.32em;color:#0f172a;">{{ otp }}</div>
</div>

<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin:18px 0 0;">
  <tr>
    <td style="padding:18px;border-radius:20px;background:#faf6ef;font-size:14px;line-height:1.7;color:#4b5563;">
      <strong style="color:#111827;">Valid for {{ expiry_minutes }} minutes.</strong><br>
      {{ safety_note }}
    </td>
  </tr>
</table>
{% endblock %}
