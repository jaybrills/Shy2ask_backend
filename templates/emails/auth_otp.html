{% extends "emails/base.html" %}

{% block body %}
<p style="margin:0 0 12px;font-size:15px;line-height:1.7;color:#374151;">
  {{ primary_note }}
</p>

<div style="margin:24px 0;padding:24px;border-radius:24px;background:#f8f7ff;border:1px solid #ddd6fe;text-align:center;">
  <div style="font-size:12px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:#6B46C1;">{{ otp_label }}</div>
  <div style="margin-top:10px;font-size:38px;font-weight:800;letter-spacing:0.32em;color:#312E81;">{{ otp }}</div>
</div>

<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin:18px 0 0;">
  <tr>
    <td style="padding:18px;border-radius:20px;background:#eef2ff;font-size:14px;line-height:1.7;color:#4338ca;">
      <strong style="color:#111827;">Valid for {{ expiry_minutes }} minutes.</strong><br>
      {{ safety_note }}
    </td>
  </tr>
</table>
{% endblock %}
