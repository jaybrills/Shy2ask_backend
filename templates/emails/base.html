<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ app_name }}</title>
</head>
<body style="margin:0;padding:0;background:#f3f0ff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1f2937;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">
    {{ preheader }}
  </div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:linear-gradient(180deg,#f5f3ff 0%,#ede9fe 100%);">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:640px;">
          <tr>
            <td style="padding:0 0 18px 4px;">
              <img src="{{ logo_url }}" alt="{{ app_name }}" width="220" style="display:block;width:220px;max-width:100%;height:auto;border:0;">
            </td>
          </tr>
          <tr>
            <td style="background:linear-gradient(135deg,#312e81 0%,#6b46c1 62%,#8b5cf6 100%);border-radius:28px;padding:36px 32px;color:#ffffff;box-shadow:0 20px 45px rgba(76,29,149,0.22);">
              <div style="font-size:12px;letter-spacing:0.18em;text-transform:uppercase;opacity:0.86;">Private communication, handled with care</div>
              <h1 style="margin:14px 0 10px;font-size:32px;line-height:1.15;font-weight:800;color:#ffffff;">{{ headline }}</h1>
              <p style="margin:0;font-size:16px;line-height:1.7;color:rgba(255,255,255,0.92);">{{ intro }}</p>
            </td>
          </tr>
          <tr>
            <td style="padding-top:18px;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#ffffff;border:1px solid #ddd6fe;border-radius:28px;padding:32px;box-shadow:0 14px 36px rgba(76,29,149,0.08);">
                <tr>
                  <td>
                    {% block body %}{% endblock %}
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:18px 6px 0;font-size:13px;line-height:1.7;color:#6b7280;">
              {{ footer_note }}<br>
              Shy2Ask protects private communication and avoids exposing personal identity in delivery emails.<br>
              Need help? Reply to this email or contact <a href="mailto:{{ support_email }}" style="color:#6B46C1;text-decoration:none;">{{ support_email }}</a>.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
